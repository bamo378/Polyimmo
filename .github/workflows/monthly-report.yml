name: PolyImmo (rapport PDF mensuel par e-mail)
on:
  schedule:
    - cron: "17 8 1 * *"    # le 1er de chaque mois, ~09:17 (hiver) / 10:17 (été) en Suisse
  workflow_dispatch:
    inputs:
      period:
        description: "Période : previous (mois précédent) ou current (mois en cours, à ce jour)"
        default: previous
      only_domain:
        description: "Essai : n'envoyer qu'aux adresses de ce domaine (vide = toutes)"
        default: ""
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_IMAP: ${{ secrets.MAIL_IMAP }}
      REPORT_TO: ${{ secrets.REPORT_TO }}
      ONLY_DOMAIN: ${{ github.event.inputs.only_domain || '' }}
      REPORT_PERIOD: ${{ github.event.inputs.period || 'previous' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dernières données (boîte du robot)
        run: |
          python scripts/fetch_aurora_mail.py
          git config user.name "polyimmo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/production.json data/power15.v64
          git diff --cached --quiet || { git commit -m "PolyImmo : données avant rapport mensuel" && git pull --rebase && git push; }
      - name: Générer les PDF avec le moteur du site
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          python -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          node scripts/monthly_report.js http://localhost:8000/ out
      - name: Envoyer par e-mail
        run: python scripts/send_report.py out
